<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Atahualpa Ecuabet Final</title>
<style>
  body{margin:0;background:#000;}
  .wrap{position:relative;width:100%;max-width:1100px;margin:0 auto;line-height:0;}
  .wrap img{width:100%;display:block;}
  .led{position:absolute;left:0;width:100%;background:#FFEB00;display:flex;overflow:hidden;z-index:10;}
  .led.bottom{bottom:11%;height:40px;align-items:center;}
  .led.middle{bottom:37.5%;height:26px;align-items:center;}
  .track{display:flex;animation:mov 15s linear infinite;}
  .item{color:#000;font-family:Arial Black;font-size:18px;padding:0 20px;flex-shrink:0;}
  .led.middle .item{font-size:12px;}
  @keyframes mov{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  .box{position:absolute;top:31%;width:15%;height:7%;background:#FFEB00;color:#000;font-family:Arial Black;display:flex;justify-content:center;align-items:center;z-index:11;font-size:18px;border-radius:4px;}
  .box.l{left:3%} .box.r{right:3%}
</style>
</head>
<body>
<div class="wrap">
  <img src="estadio.jpg">
  <div class="box l">Ecuabet</div>
  <div class="box r">Ecuabet</div>

  <div class="led middle">
    <div class="track">
      <span class="item">Ecuabet</span><span class="item">Ecuabet</span><span class="item">Ecuabet</span><span class="item">Ecuabet</span><span class="item">Ecuabet</span><span class="item">Ecuabet</span><span class="item">Ecuabet</span><span class="item">Ecuabet</span>
      <span class="item">Ecuabet</span><span class="item">Ecuabet</span><span class="item">Ecuabet</span><span class="item">Ecuabet</span><span class="item">Ecuabet</span><span class="item">Ecuabet</span><span class="item">Ecuabet</span><span class="item">Ecuabet</span>
    </div>
  </div>

  <div class="led bottom">
    <div class="track">
      <span class="item">Ecuabet</span><span class="item">Ecuabet</span><span class="item">Ecuabet</span><span class="item">Ecuabet</span><span class="item">Ecuabet</span><span class="item">Ecuabet</span><span class="item">Ecuabet</span><span class="item">Ecuabet</span>
      <span class="item">Ecuabet</span><span class="item">Ecuabet</span><span class="item">Ecuabet</span><span class="item">Ecuabet</span><span class="item">Ecuabet</span><span class="item">Ecuabet</span><span class="item">Ecuabet</span><span class="item">Ecuabet</span>
    </div>
  </div>
</div>
</body>
</html>
