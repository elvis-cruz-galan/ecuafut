<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecuafut - La Enciclopedia Histórica de la LigaPro</title>
    <style>
        /* Base del sitio */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* BARRA DE NAVEGACIÓN - Diseño Limpio */
        .nav-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #161b22;
            padding: 15px 5%;
            border-bottom: 2px solid #38bdf8;
        }

        .nav-logo {
            font-size: 1.6rem;
            font-weight: bold;
            color: #ffd700;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .nav-list {
            display: flex;
            list-style: none;
            gap: 30px;
            margin: 0;
            padding: 0;
        }

        .nav-link a {
            color: #ffffff;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .nav-link a:hover {
            color: #ffd700;
        }

        /* Contenedor Principal */
        .container {
            max-width: 800px;
            margin: 60px auto;
            padding: 20px;
            text-align: center;
            flex: 1;
        }

        h1 {
            font-size: 3rem;
            color: #ffd700;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        p {
            font-size: 1.2rem;
            line-height: 1.6;
            color: #8b949e;
            margin-bottom: 30px;
        }

        .badge {
            display: inline-block;
            background-color: #1f293d;
            color: #38bdf8;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
            border: 1px solid #38bdf8;
        }

        /* Pie de página */
        footer {
            background-color: #161b22;
            text-align: center;
            padding: 20px;
            font-size: 0.9rem;
            color: #64748b;
            border-top: 1px solid #21262d;
        }

        /* Adaptación para Celulares */
        @media (max-width: 600px) {
            .nav-box {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }
            .nav-list {
                gap: 20px;
            }
            h1 {
                font-size: 2.2rem;
            }
        }
    </style>
</head>
<body>

    <nav class="nav-box">
        <a href="#" class="nav-logo">Ecuafut</a>
        <ul class="nav-list">
            <li class="nav-link"><a href="#">Inicio</a></li>
            <li class="nav-link"><a href="#">Equipos</a></li>
            <li class="nav-link"><a href="#">Tabla</a></li>
            <li class="nav-link"><a href="#">Historia</a></li>
        </ul>
    </nav>

    <div class="container">
        <h1>ECUAFUT</h1>
        <p>Próximamente, la base de datos definitiva con toda la historia, estadísticas, escudos y campeones de la LigaPro desde su fundación en 2019.</p>
        <div class="badge">⚙️ Sitio en Desarrollo Activo</div>
    </div>

    <footer>
        &copy; 2026 Ecuafut. Creado por Elvis Cruz Galán.
    </footer>

</body>
</html>
