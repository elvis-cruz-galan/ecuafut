<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecuafut - La Enciclopedia Histórica de la LigaPro</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 600px;
            padding: 20px;
        }
        h1 {
            color: #facc15; /* Color oro futbolero */
            font-size: 3rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        p {
            font-size: 1.2rem;
            color: #94a3b8;
            line-height: 1.6;
        }
        .badge {
            background-color: #1e293b;
            border: 2px solid #334155;
            padding: 10px 20px;
            border-radius: 50px;
            display: inline-block;
            margin-top: 20px;
            font-weight: bold;
            color: #38bdf8;
        }
        footer {
            margin-top: 50px;
            font-size: 0.9rem;
            color: #64748b;
        }

    <div class="container">
        <h1>Ecuaball</h1>
        <p>Próximamente, la base de datos de proporciones bíblicas con toda la historia, estadísticas, escudos y campeones de la LigaPro desde su fundación en 2019.</p>
        <div class="badge">⚙️ Sitio en Desarrollo Activo</div>
